name: Extension CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      variant:
        description: Extension display mode
        type: choice
        default: popup
        options: [popup, sidepanel]

env:
  EXTENSION_VARIANT: ${{ inputs.variant || 'popup' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant || 'popup' }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, build, and verify extension files
        shell: bash
        run: |
          case "$EXTENSION_VARIANT" in
            popup) pnpm run check ;;
            sidepanel) pnpm run check:sidepanel ;;
            *) echo "Unknown extension variant" >&2; exit 1 ;;
          esac

      # @sample-begin
      - name: Verify the base without samples
        if: env.EXTENSION_VARIANT == 'popup'
        run: pnpm run samples:verify

      # @sample-end
      - name: Package verified extension
        id: package
        working-directory: dist/${{ env.EXTENSION_VARIANT }}
        shell: bash
        run: |
          archive_path="$RUNNER_TEMP/chrome-extension-${EXTENSION_VARIANT}-${GITHUB_SHA:0:12}.zip"
          zip -q -r "$archive_path" .
          unzip -t "$archive_path"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload extension ZIP
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      # Tags also build the release package (no source maps) after checking the tag matches package.json.
      - name: Build release package
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          case "$EXTENSION_VARIANT" in
            popup) pnpm run release ;;
            sidepanel) pnpm run release:sidepanel ;;
          esac
          name=$(node -p "require('./package.json').name")
          echo "path=release/${name}-${EXTENSION_VARIANT}-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload release ZIP
        id: release-artifact
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.release.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          RELEASE_URL: ${{ steps.release-artifact.outputs.artifact-url }}
        shell: bash
        run: |
          {
            printf '### Chrome 拡張の動作確認\n\n'
            printf '表示方式: `%s`\n\n' "$EXTENSION_VARIANT"
            printf '[検証済み ZIP をダウンロード](%s)\n\n' "$ARTIFACT_URL"
            printf 'ZIP を展開し、Chrome の `chrome://extensions` でデベロッパーモードを有効にしてください。\n\n'
            printf '「パッケージ化されていない拡張機能を読み込む」で、展開した `manifest.json` のあるフォルダーを選びます。\n\n'
            printf 'Commit: `%s`。保存期間は 30 日です。\n' "$GITHUB_SHA"
            if [ -n "$RELEASE_URL" ]; then
              printf '\n### 公開用 ZIP\n\n[ソースマップなしの公開用 ZIP をダウンロード](%s)（保存期間 90 日）\n' "$RELEASE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
