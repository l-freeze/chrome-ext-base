name: Extension CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, typecheck, build, and verify extension files
        run: pnpm run check

      - name: Package verified extension
        id: package
        working-directory: dist
        shell: bash
        run: |
          archive_path="$RUNNER_TEMP/chrome-extension-${GITHUB_SHA:0:12}.zip"
          zip -q -r "$archive_path" .
          unzip -t "$archive_path"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload extension ZIP
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Write download instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        shell: bash
        run: |
          {
            printf '### Chrome 拡張の動作確認\n\n'
            printf '[検証済み ZIP をダウンロード](%s)\n\n' "$ARTIFACT_URL"
            printf 'ZIP を展開し、Chrome の `chrome://extensions` でデベロッパーモードを有効にしてください。\n\n'
            printf '「パッケージ化されていない拡張機能を読み込む」で、展開した `manifest.json` のあるフォルダーを選びます。\n\n'
            printf 'Commit: `%s`。保存期間は 30 日です。\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
