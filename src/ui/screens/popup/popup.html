<div class="popup-toolbar">
  <p class="intro-copy">思いついたことを、忘れないうちに。</p>
  <a href="./options.html" target="_blank" rel="noopener" class="btn btn-ghost btn-xs">設定 ↗</a>
</div>

<section class="card bg-base-100 note-card" aria-labelledby="note-title">
  <form id="note-form" class="card-body">
    <div class="note-heading">
      <label id="note-title" class="note-label" for="note">
        <svg class="size-4 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m14 5 5 5M4 20l4.5-1 12-12a2.1 2.1 0 0 0-3-3l-12 12L4 20Z" />
        </svg>
        今日のメモ
      </label>
      <span class="badge badge-sm badge-soft badge-primary note-counter" id="note-count" aria-live="off">0 / 2,000</span>
    </div>
    <textarea id="note" name="note" class="textarea textarea-ghost note-editor" rows="5" maxlength="2000"
      placeholder="次にやりたいこと、気になったこと。&#10;ここは、あなたの小さなメモ帳。"
      aria-describedby="note-help note-count" disabled></textarea>
    <div class="note-actions">
      <p id="note-help" class="keyboard-hint"><kbd class="kbd kbd-xs">Ctrl / ⌘</kbd><kbd class="kbd kbd-xs">↵</kbd><span>で保存</span></p>
      <button type="submit" class="btn btn-primary btn-sm save-button" disabled>
        <span data-button-spinner class="loading loading-spinner loading-xs hidden" aria-hidden="true"></span>
        <svg data-button-icon class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m5 12 4 4L19 6" />
        </svg>
        保存する
      </button>
    </div>
  </form>
</section>

<div id="status" class="alert alert-soft alert-info feedback" role="status" aria-live="polite" aria-atomic="true" data-state="loading">
  <span data-feedback-indicator class="loading loading-spinner loading-xs" aria-hidden="true"></span>
  <span data-feedback-text>読み込み中…</span>
</div>

<section class="card bg-base-100 page-card" aria-labelledby="capture-title">
  <div class="card-body">
    <div class="page-heading"><h2 id="capture-title">今見ているページ</h2><span id="preview-label" class="badge badge-soft badge-sm" hidden>プレビュー</span></div>
    <button id="capture-page" class="btn btn-outline btn-primary btn-sm" type="button" disabled>タイトル・URL・選択テキストを取得</button>
    <p id="page-status" class="page-help" role="status" aria-live="polite">通常の Web ページを開いてから取得してください。</p>
    <div id="page-result" class="page-result" hidden>
      <h3 id="page-title"></h3>
      <p id="page-url" class="page-url"></p>
      <blockquote id="page-selection"></blockquote>
      <p id="page-truncated" class="page-help" hidden>選択テキストは先頭 2,000 文字まで表示しています。</p>
    </div>
  </div>
</section>

<details class="card sample-card coffee-details">
  <summary>☕ REST サンプル · コーヒー情報を取得</summary>
  <div class="card-body">
    <button id="import-sample" class="btn btn-soft btn-sm sample-button" type="button" aria-describedby="sample-help" disabled>
      <span data-button-spinner class="loading loading-spinner loading-xs hidden" aria-hidden="true"></span>
      サンプルを取得して保存
      <svg data-button-icon class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg>
    </button>
    <p id="sample-help" class="sample-help">SampleAPIs のコーヒー情報で、現在のメモを置き換えます。</p>
  </div>
</details>

<aside class="live-settings" aria-label="反映中の設定">
  <p><span class="live-dot" aria-hidden="true"></span> <span id="theme-setting">読み込み中</span><span class="settings-divider">/</span>選択テキスト <strong id="selection-setting">—</strong></p>
  <p id="settings-status" role="status" aria-live="polite">設定を読み込み中…</p>
</aside>
